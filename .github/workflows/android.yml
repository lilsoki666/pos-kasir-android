name: Build UniversalPOS Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # 1. Mengambil source code dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. Install Java dan dependency Android/Buildozer
      - name: Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # 4. Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # 5. Install Buildozer + Cython
      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython


      # 6. Cache Buildozer
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # 7. Build APK
      - name: Build Android APK
        run: |
          yes | buildozer android debug


      # 8. Cek hasil build
      - name: List APK
        run: |
          ls -lah bin/


      # 9. Upload APK ke GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPOS-Android
          path: bin/*.apk
          if-no-files-found: error
