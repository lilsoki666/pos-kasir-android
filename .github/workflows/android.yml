name: Build UniversalPOS Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # 4. SYSTEM DEPENDENCIES
      # ==========================================

      - name: Install System Dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # 5. PYTHON DEPENDENCIES
      # ==========================================

      - name: Install Python Dependencies
        run: |

          python -m pip install --upgrade pip setuptools wheel

          pip install \
            buildozer \
            cython


      # ==========================================
      # 6. CACHE BUILDOZER
      # ==========================================

      - name: Cache Buildozer
        uses: actions/cache@v4

        with:

          path: |
            ~/.buildozer
            .buildozer

          key: |
            buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            buildozer-${{ runner.os }}-


      # ==========================================
      # 7. CHECK ENVIRONMENT
      # ==========================================

      - name: Install Android SDK Build Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Download Android SDK Command Line Tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools tools
          
          # Install build-tools and other required components
          yes | $ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platform-tools"

      - name: Check Build Environment
        run: |

          echo "================================="
          echo "JAVA"
          echo "================================="

          java -version

          echo "================================="
          echo "PYTHON"
          echo "================================="

          python --version

          echo "================================="
          echo "BUILDOZER"
          echo "================================="

          buildozer --version

          echo "================================="
          echo "ANDROID"
          echo "================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"


      # ==========================================
      # 8. CLEAN OLD BUILD
      # ==========================================

      - name: Clean Build
        run: |

          buildozer android clean || true


      # ==========================================
      # 9. BUILD APK
      # ==========================================

      - name: Build Android APK
        run: |

          set -o pipefail

          for attempt in 1 2 3; do

            echo "======================================"
            echo "BUILD ATTEMPT $attempt / 3"
            echo "======================================"

            if buildozer -v android debug 2>&1 | tee build.log; then

              echo "BUILD SUCCESS"

              exit 0

            fi

            echo "BUILD FAILED"

            if [ "$attempt" -lt 3 ]; then

              echo "Waiting before retry..."

              sleep $((attempt * 20))

            fi

          done

          echo "======================================"
          echo "ALL BUILD ATTEMPTS FAILED"
          echo "======================================"

          exit 1


      # ==========================================
      # 10. CHECK APK
      # ==========================================

      - name: Verify APK
        run: |

          echo "APK RESULT"

          ls -lah bin/

          find bin -name "*.apk" -type f


      # ==========================================
      # 11. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: UniversalPOS-Android

          path: |
            bin/*.apk

          if-no-files-found: error


      # ==========================================
      # 12. UPLOAD BUILD LOG
      # ==========================================

      - name: Upload Build Log
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: UniversalPOS-Build-Log

          path: |
            build.log
