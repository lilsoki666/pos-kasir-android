name: Build UniversalPOS Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================
      # JAVA
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # PYTHON
      # =========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # =========================================
      # SYSTEM DEPENDENCIES
      # =========================================

      - name: Install System Dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # =========================================
      # BUILDOZER
      # =========================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install \
            "buildozer>=1.6.0" \
            "cython<3"


      # =========================================
      # ANDROID SDK
      # =========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================
      # ACCEPT ANDROID LICENSES
      # =========================================

      - name: Accept Android SDK Licenses
        run: |

          yes | sdkmanager --licenses || true


      # =========================================
      # INSTALL REQUIRED SDK
      # =========================================

      - name: Install Android SDK Packages
        run: |

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================
      # VERIFY SDK
      # =========================================

      - name: Verify Android SDK
        run: |

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDK PACKAGES:"
          sdkmanager --list_installed

          echo ""
          echo "AIDL:"
          find "$ANDROID_HOME" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "BUILD TOOLS:"
          ls -lah "$ANDROID_HOME/build-tools/"


      # =========================================
      # BUILDOZER CACHE
      # =========================================

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:

          path: |
            ~/.buildozer
            .buildozer

          key: universalpos-buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            universalpos-buildozer-${{ runner.os }}-


      # =========================================
      # CLEAN
      # =========================================

      - name: Clean Build
        run: |

          buildozer android clean || true


      # =========================================
      # BUILD
      # =========================================

      - name: Build APK
        run: |

          buildozer -v android debug


      # =========================================
      # VERIFY APK
      # =========================================

      - name: Verify APK
        run: |

          echo "======================================"
          echo "APK FILE"
          echo "======================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          ls -lah bin/


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: UniversalPOS-Android

          path: bin/*.apk

          if-no-files-found: error
