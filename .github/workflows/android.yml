name: Build UniversalPOS Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # PYTHON 3.11
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # ==========================================
      # LINUX DEPENDENCIES
      # ==========================================

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # ACCEPT ANDROID LICENSES
      # ==========================================

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true


      # ==========================================
      # INSTALL ANDROID SDK COMPONENTS
      # ==========================================

      - name: Install Android Components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"


      # ==========================================
      # VERIFY ANDROID SDK
      # ==========================================

      - name: Verify Android SDK
        run: |
          echo "======================================"
          echo "ANDROID HOME"
          echo "======================================"

          echo "$ANDROID_HOME"

          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"

          ls -lah "$ANDROID_HOME/build-tools"

          echo "======================================"
          echo "SEARCHING AIDL"
          echo "======================================"

          AIDL=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aidl \
            | sort \
            | tail -n 1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL NOT FOUND"
            exit 1
          fi

          echo "AIDL FOUND:"
          echo "$AIDL"

          echo "======================================"
          echo "TESTING AIDL"
          echo "======================================"

          "$AIDL" --help > /dev/null

          echo "AIDL CHECK PASSED"


      # ==========================================
      # INSTALL BUILDOZER
      # ==========================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install buildozer

          pip install "cython<3"


      # ==========================================
      # CONFIGURE ANDROID ENVIRONMENT
      # ==========================================

      - name: Configure Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"


      # ==========================================
      # CLEAR OLD BUILDOZER SDK
      # ==========================================

      - name: Clear Old Buildozer SDK
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk || true


      # ==========================================
      # CACHE BUILDOZER
      # ==========================================

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer

          key: universalpos-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            universalpos-${{ runner.os }}-


      # ==========================================
      # VALIDATE PYTHON
      # ==========================================

      - name: Validate Python
        run: |
          python -m py_compile main.py

          echo "Python syntax check passed."


      # ==========================================
      # SHOW BUILDOZER CONFIG
      # ==========================================

      - name: Check Buildozer Configuration
        run: |
          buildozer --version

          echo "======================================"
          echo "BUILDOZER SPEC"
          echo "======================================"

          grep -E \
            "^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.ndk_version|android.archs)" \
            buildozer.spec || true


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        run: |
          buildozer -v android debug


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        run: |
          echo "======================================"
          echo "APK RESULT"
          echo "======================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          ls -lah bin/


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPOS-Android
          path: bin/*.apk
          if-no-files-found: error
