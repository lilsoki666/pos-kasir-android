name: Build UniversalPOS Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Install Android SDK
        uses: android-actions/setup-android@v3


      - name: Prepare Android SDK
        run: |

          echo "ANDROID SDK:"
          echo "$ANDROID_HOME"

          sdkmanager --update || true

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==================================================
      # CREATE AIDL LINK
      # ==================================================

      - name: Prepare AIDL
        run: |

          echo "Searching for AIDL..."

          AIDL=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aidl \
            | sort \
            | tail -n 1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL NOT FOUND"
            exit 1
          fi

          echo "AIDL FOUND:"
          echo "$AIDL"

          chmod +x "$AIDL"

          "$AIDL" --version


      # ==================================================
      # INSTALL BUILDOZER
      # ==================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install "cython<3"


      # ==================================================
      # ENVIRONMENT
      # ==================================================

      - name: Configure Android Environment
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"


      # ==================================================
      # REMOVE OLD BUILDOZER SDK
      # ==================================================

      - name: Remove Buildozer Internal SDK
        run: |

          rm -rf ~/.buildozer/android/platform/android-sdk

          mkdir -p ~/.buildozer/android/platform


      # ==================================================
      # CACHE
      # ==================================================

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer

          key: universalpos-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            universalpos-${{ runner.os }}-


      # ==================================================
      # CHECK CONFIGURATION
      # ==================================================

      - name: Check Configuration
        run: |

          echo "================================"
          echo "ANDROID_HOME"
          echo "================================"

          echo "$ANDROID_HOME"

          echo "================================"
          echo "SDK"
          echo "================================"

          ls -lah "$ANDROID_HOME"

          echo "================================"
          echo "BUILD TOOLS"
          echo "================================"

          ls -lah "$ANDROID_HOME/build-tools"

          echo "================================"
          echo "AIDL"
          echo "================================"

          find "$ANDROID_HOME/build-tools" \
            -name aidl \
            -type f


      # ==================================================
      # BUILD
      # ==================================================

      - name: Build APK
        run: |

          buildozer -v android debug


      # ==================================================
      # VERIFY
      # ==================================================

      - name: Verify APK
        run: |

          echo "================================"
          echo "APK RESULT"
          echo "================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          ls -lah bin/


      # ==================================================
      # UPLOAD
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPOS-Android
          path: bin/*.apk
          if-no-files-found: error
