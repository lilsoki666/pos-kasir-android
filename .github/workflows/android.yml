name: Build UniversalPOS Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # JAVA 17
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # PYTHON
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # -----------------------------
      # SYSTEM DEPENDENCIES
      # -----------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      # -----------------------------
      # ANDROID SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -----------------------------
      # ACCEPT ALL LICENSES
      # -----------------------------
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      # -----------------------------
      # INSTALL SDK
      # -----------------------------
      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # -----------------------------
      # VERIFY SDK
      # -----------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Installed Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools"

          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" \
            -name aidl \
            -type f \
            -print

      # -----------------------------
      # BUILDOZER
      # -----------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install "cython<3"

      # -----------------------------
      # BUILDOZER ENVIRONMENT
      # -----------------------------
      - name: Configure Buildozer
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      # -----------------------------
      # CACHE
      # -----------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: universalpos-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            universalpos-${{ runner.os }}-

      # -----------------------------
      # BUILD
      # -----------------------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # -----------------------------
      # CHECK APK
      # -----------------------------
      - name: Check APK
        run: |
          echo "APK:"
          find bin -type f -name "*.apk" -print

          ls -lah bin/

      # -----------------------------
      # UPLOAD APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPOS-Android
          path: bin/*.apk
          if-no-files-found: error
